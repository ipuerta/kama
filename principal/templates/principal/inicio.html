{% extends 'principal/base.html' %}

{% block content %}
<style>
    .hub-card {
        transition: transform 0.2s;
        border-radius: 25px;
        text-align: center;
        padding: 2rem 1rem;
    }
    .hub-card:active { transform: scale(0.95); }
    .icon-box { font-size: 3.5rem; margin-bottom: 15px; }
</style>

<div class="row g-4">
    <div class="col-6 col-md-3">
        <a href="{% url 'grupos' %}" class="text-decoration-none text-dark">
            <div class="card h-100 border-0 shadow-sm hub-card bg-primary bg-opacity-25 text-center">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16">
                        <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                    </svg>
                </div>
                <h5 class="fw-bold">Grupos</h5>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-3">
        <a href="{% url 'artistas' %}" class="text-decoration-none text-dark">
            <div class="card h-100 border-0 shadow-sm hub-card bg-primary bg-opacity-25">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                        <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                    </svg>
                </div>
                <h5 class="fw-bold">Artistas</h5>
            </div>
        </a>
    </div>

    <div class="col-6 col-md-3">
        <a href="{% url 'inicio' %}" class="text-decoration-none text-dark">
            <div class="card h-100 border-0 shadow-sm hub-card bg-primary bg-opacity-25">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-flag-fill" viewBox="0 0 16 16">
                        <path d="M14.778.085A.5.5 0 0 1 15 .5V8a.5.5 0 0 1-.314.464L14.5 8l.186.464-.003.001-.006.003-.023.009a12 12 0 0 1-.397.15c-.264.095-.631.223-1.047.35-.816.252-1.879.523-2.71.523-.847 0-1.548-.28-2.158-.525l-.028-.01C7.68 8.71 7.14 8.5 6.5 8.5c-.7 0-1.638.23-2.437.477A20 20 0 0 0 3 9.342V15.5a.5.5 0 0 1-1 0V.5a.5.5 0 0 1 1 0v.282c.226-.079.496-.17.79-.26C4.606.272 5.67 0 6.5 0c.84 0 1.524.277 2.121.519l.043.018C9.286.788 9.828 1 10.5 1c.7 0 1.638-.23 2.437-.477a20 20 0 0 0 1.349-.476l.019-.007.004-.002h.001"/>
                    </svg>
                </div>
                <h5 class="fw-bold">Países</h5>
            </div>
        </a>
    </div>
</div>
{% endblock %}
