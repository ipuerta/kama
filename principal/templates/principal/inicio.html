{% extends 'principal/base.html' %}

{% block content %}
<style>
    .hub-card {
        transition: transform 0.2s;
        border-radius: 25px;
        text-align: center;
        padding: 2rem 1rem;
    }
    .hub-card:active { transform: scale(0.95); }
    .icon-box { font-size: 3.5rem; margin-bottom: 15px; }
</style>

<div class="row g-4">
    <div class="col-6 col-md-3">
        <a href="{% url 'grupos' %}" class="text-decoration-none text-dark">
            <div class="card h-100 border-0 shadow-sm hub-card bg-primary bg-opacity-25 text-center">
                <div class="icon-box">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-people-fill" viewBox="0 0 16 16">
                        <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784 6A2.24 2.24 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.3 6.3 0 0 0 5 9c-4 0-5 3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
