{% extends 'principal/base.html' %}

{% block content %}
<div class="container mt-3 pb-5">
    <div class="d-flex align-items-center mb-4">
        <a href="{% url 'videos' %}" class="btn btn-light rounded-circle shadow-sm me-3">←</a>
        <h4 class="fw-bold m-0">Añadir Girl Group</h4>
    </div>

    <div class="card border-0 shadow-sm rounded-4">
        <div class="card-body p-4">
            <form method="POST">
                {% csrf_token %}

                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold text-muted small">{{ field.label|upper }}</label>

                    {% if field.name == 'pais' %}
                        <div class="input-group">
                            {{ field }}
                            <button type="button" class="btn btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#modalPais">
                                +
                            </button>
                        </div>
                    {% else %}
                        {{ field }}
                    {% endif %}

                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
                {% endfor %}

                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-primary py-3 rounded-3 fw-bold">Guardar Registro</button>
                    <a href="{% url 'videos' %}" class="btn btn-link text-muted">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalPais" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Nuevo País</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <input type="text" id="nuevo_nombre_pais" class="form-control" placeholder="Nombre del país">
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" onclick="ejecutarGuardarPais()" class="btn btn-primary">Guardar País</button>
      </div>
    </div>
  </div>
</div>

<script>
    console.log("Cargando scripts de alta...");

    window.ejecutarGuardarPais = function() {
        console.log("Botón pulsado...");
        const nombreInput = document.getElementById('nuevo_nombre_pais');
        const nombreValue = nombreInput.value.trim();

        if (!nombreValue) {
            alert("Escribe el nombre del país.");
            return;
        }

        let formData = new FormData();
        formData.append('nombre', nombreValue);
        formData.append('csrfmiddlewaretoken', '{{ csrf_token }}');

        fetch("{% url 'ajax_crear_pais' %}", {
            method: "POST",
            body: formData,
            headers: { "X-Requested-With": "XMLHttpRequest" }
        })
        .then(response => response.json())
        .then(data => {
            console.log("Éxito:", data);
            const selectPais = document.querySelector('select[name="pais"]');
            const nuevaOpcion = new Option(data.nombre, data.id, true, true);
            selectPais.add(nuevaOpcion);

            // Cerrar modal
            const modalElement = document.getElementById('modalPais');
            const modalInstance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
            modalInstance.hide();
            nombreInput.value = '';
        })
        .catch(error => console.error("Error:", error));
    };
</script>

{% endblock %}
