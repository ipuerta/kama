{% extends 'principal/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <div class="card shadow border-0 p-4" style="border-radius: 20px;">
            <h2 class="text-center mb-4">Cambiar Contraseña</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }} <button type="submit" class="btn btn-primary w-100 rounded-pill mt-3">Guardar Cambios</button>
                <a href="{% url 'login' %}" class="btn btn-link w-100 text-secondary mt-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
